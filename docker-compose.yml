# Base PostgreSQL locale pour le développement. Identifiants de dev uniquement.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hexaapp
      POSTGRES_USER: hexaapp
      POSTGRES_PASSWORD: hexaapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
